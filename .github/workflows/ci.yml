name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: "file:./ci.db"

jobs:
  quality:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm build

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Run unit tests
        run: pnpm test:unit

  service:
    name: Service tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:/tmp/worldforge-service-tests/test.db?connection_limit=1"
      WORLD_CREATION_TEST_DATABASE_URL: "file:/tmp/worldforge-service-tests/test.db?connection_limit=1"
      WORLDFORGE_ASSET_DIR: "/tmp/worldforge-service-tests/assets"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Prepare isolated test storage
        run: mkdir -p "$WORLDFORGE_ASSET_DIR"
      - run: pnpm db:deploy
      - name: Run service tests
        run: pnpm test:service

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    # Server-backed suites share a SQLite file with the dev server; tests run
    # serially and use a single connection to avoid journal lock races.
    env:
      DATABASE_URL: "file:/tmp/worldforge-tests/test.db?connection_limit=1"
      WORLD_CREATION_TEST_DATABASE_URL: "file:/tmp/worldforge-tests/test.db?connection_limit=1"
      WORLDFORGE_ASSET_DIR: "/tmp/worldforge-tests/assets"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Prepare isolated test storage
        run: mkdir -p "$WORLDFORGE_ASSET_DIR"
      - run: pnpm db:deploy
      - name: Start dev server
        run: |
          WORLDFORGE_ASSET_DIR="$WORLDFORGE_ASSET_DIR" \
          WORLD_CREATION_TEST_DATABASE_URL="$WORLD_CREATION_TEST_DATABASE_URL" \
          WORLDFORGE_ORIGIN=http://127.0.0.1:3131 \
            pnpm exec next dev --hostname 127.0.0.1 --port 3131 > /tmp/next-dev.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3131/login > /dev/null; then
              echo "Dev server ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/next-dev.log
          exit 1
      - name: Run HTTP tests against dev server
        env:
          WORLDFORGE_TEST_ORIGIN: http://127.0.0.1:3131
          WORLDFORGE_ORIGIN: http://127.0.0.1:3131
        run: pnpm test:http
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser interaction tests
        env:
          WORLDFORGE_TEST_ORIGIN: http://127.0.0.1:3131
        run: pnpm test:browser

  production-auth:
    name: Production authentication smoke
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:/tmp/worldforge-production-auth/test.db?connection_limit=1"
      WORLD_CREATION_TEST_DATABASE_URL: "file:/tmp/worldforge-production-auth/test.db?connection_limit=1"
      WORLDFORGE_ASSET_DIR: "/tmp/worldforge-production-auth/assets"
      WORLDFORGE_ORIGIN: "http://127.0.0.1:3132"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Prepare isolated production storage
        run: mkdir -p "$WORLDFORGE_ASSET_DIR"
      - run: pnpm db:deploy
      - run: pnpm build
      - name: Start production server
        run: |
          pnpm exec next start --port 3132 > /tmp/next-start.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3132/login > /dev/null; then
              echo "Production server ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/next-start.log
          exit 1
      - name: Verify production authentication
        env:
          WORLDFORGE_PRODUCTION_TEST_ORIGIN: "http://127.0.0.1:3132"
        run: pnpm test:production-auth
